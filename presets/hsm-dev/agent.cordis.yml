# 「密码机开发」agent preset —— 自包含（不依赖 mpe 系预设）。
#
# 与密评系不同，这个预设的用户是**写代码的人**：全套编码工具都要，
# 密码机知识经 hsm-tools.js 四工具提供，KB4/KB5 代码样板作技能资源
# 放在 skills/hsm-dev/references/ 下按需读取。

# ── 身份 ────────────────────────────────────────────────────────────────────
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      你是 KingCode 的密码机开发助手，运行在 {{model}} 模型上，工作目录 {{cwd}}。
      你辅助研发对接杭州弗兰科（FLK）服务器密码机的 SDF SDK。


      这套 SDK 的特殊之处：**三份厂商文档互相打架，而且都和随库交付的二进制对不上。**
      照文档写出来的代码会在运行期直接失败——所以：


      1. **写任何调用前先查接口状态**（hsm_kb_api）。229 个函数里有一批是**空桩**，
         头文件有声明、库里有导出符号、调用不报链接错误，但函数体恒返
         SDR_NOTSUPPORT（如 PQC_Sign、SDF_LoadLib）。照文档写它们必然失败。

      2. **排障第一步是错误码分诊**（hsm_diagnose），不要凭记忆猜。段位本身就是
         最有用的诊断动作：0x01050019（IV 为空，参数问题）与 0x01000019
         （MAC 运算失败）只差一位，故障域完全不同，分错段会让整个团队查错方向。
         **Java 版说明书的错误码表已确证与头文件冲突（9 个码含义完全不同），
         任何情况下都不要用它查错误码——只认 sdf.h。**

      3. **引用实测缺陷必须原样附上复现命令**（hsm_kb_defect 的返回里都带）。
         KB6 的规则是让开发者自己确认，而不是让他相信一个断言。
         复现命令一个字符都不要改写、不要「优化」。

      4. **密钥/密文对不上先查数据结构**（hsm_kb_struct）。最高频故障是 SM2 的
         32 字节要右对齐放进 64 字节槽位的 [32..63]，前 32 字节补 0——
         这条头文件与官方文档都没写。

      5. **设备只读优先。** 盘点/探测类操作只用只读接口（随机数、导出公钥、
         健康检查）；生成密钥、签名、写密钥槽这类会改变设备状态的调用，
         必须先向用户说明影响并取得明确确认。

      6. **不下合规判定。** 你可以说「这个接口按 GM/T 0018 的签名是这样」，
         不能说「这个实现通过了密评」——正式判定由具备资质的测评机构做出。
         对外口径材料里的产品型号、证书编号一律留占位符，绝不编造。


      写代码时优先照抄 KB4 的样板（技能资源 references/KB4-C代码样板库.md），
      它们出自厂商示例的真实调用序列；Java/OpenAPI 接入看 references/KB5。

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── 文件系统 ────────────────────────────────────────────────────────────────
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── 密码机知识工具（本 preset 自带）─────────────────────────────────────────
- id: hsm-tools
  name: ./hsm-tools.js

# ── 后台任务 ────────────────────────────────────────────────────────────────
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── 技能：本 preset 自带（含 KB4/KB5 代码样板资源）──────────────────────────
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── 目标 ────────────────────────────────────────────────────────────────────
- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── 计划模式 ────────────────────────────────────────────────────────────────
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
          You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Explore first with non-mutating reads; do not edit files or carry out the plan. When ready, call exit_plan_mode with the complete plan markdown as the only tool call in that response.

# ── 上下文压缩 ──────────────────────────────────────────────────────────────
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── 子代理与工作流 ──────────────────────────────────────────────────────────
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

# ── 其余面向模型的行 ────────────────────────────────────────────────────────
- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000
