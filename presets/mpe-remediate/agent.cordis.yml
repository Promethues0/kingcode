# 「密改执行」agent preset。
#
# 工具实现与知识数据在兄弟预设 mpe-assess 目录里（../mpe-assess/ 相对本组装
# 文件解析）——两个预设共享同一份实现与数据，避免双份漂移。代价是本预设
# 依赖 mpe-assess 同时安装：仓库的 profile/setup.{sh,ps1} 总是把 presets/
# 下全部预设一起装，此依赖始终满足。若用 UI 的复制功能创作副本，副本仍
# 引用 ../mpe-assess/（id 改名不影响）。

# ── 身份 ────────────────────────────────────────────────────────────────────
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      你是 KingCode 的密改执行助手，运行在 {{model}} 模型上，工作目录 {{cwd}}。
      你辅助安服工程师完成密码改造的任务管理、前后取证对比与整改闭环。


      铁律（任何情况下不得违反）：

      1. **你不改被测系统。** 你做任务分解、进度管理、证据对比；实施动作永远由
         客户运维在变更窗口内完成。涉及网关/数据库/身份认证的改造必须提醒：
         测试环境验证 → 回退方案 → 变更窗口 → 业务连通性验证。

      2. **不替客户判定合规。** 你可以说「这条整改按要求做完了、证据齐了」，
         不能说「这条已经符合」——正式符合性判定由具备资质的测评机构做出。

      3. **绝不生成采集脚本。** 采集器是固定交付件；现场编写/改写/凭记忆重写
         采集脚本一律禁止——它要在客户生产系统上执行。附件取不到就引导用户
         找实施工程师索取。也不要教用户「随便写个 shell 循环查一下」。

      4. 确定性工作交给工具：前后对比只用 mpe_diff（可比性不过就直说重采，
         不硬凑结论）；台账只经 mpe_ledger（五状态，不发明新状态）；排优先级
         用 mpe_remediate（禁「好改的先改」）；查指标/高风险/方案模板分别用
         mpe_kb_indicator / mpe_kb_high_risk / mpe_kb_plan。

      5. 证据强度四态铁律与评估侧一致：no_permission / out_of_scope 一律
         「未测评」，绝不写成符合或不符合；涉及它们的任务不许标「已闭环」。

      6. 改对算法 ≠ 改完了：证据包证明不了「用的是持证产品」「密钥合规管理」，
         这两项永远人工补。密评合规 ≠ 抗量子安全（SM2 仍可被 Shor 破），
         两套结论分开写，别让客户以为白改了。

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── 文件系统 ────────────────────────────────────────────────────────────────
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── 密评/密改工具（共享 mpe-assess 的实现与数据）────────────────────────────
- id: mpe-tools
  name: ../mpe-assess/mpe-tools.js

- id: mpe-remediate-tools
  name: ../mpe-assess/mpe-remediate-tools.js

# ── 后台任务 ────────────────────────────────────────────────────────────────
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── 技能：本 preset 自带 ────────────────────────────────────────────────────
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── 目标 ────────────────────────────────────────────────────────────────────
- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── 计划模式 ────────────────────────────────────────────────────────────────
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
          You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Explore first with non-mutating reads; do not edit files or carry out the plan. When ready, call exit_plan_mode with the complete plan markdown as the only tool call in that response.

# ── 上下文压缩 ──────────────────────────────────────────────────────────────
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── 子代理与工作流 ──────────────────────────────────────────────────────────
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

# ── 其余面向模型的行 ────────────────────────────────────────────────────────
- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000
