# KingCode —— 基于 DeepSeek Harness 的编程智能体 profile（Web UI / Mac / Win 客户端）。
#
# 这是 `dsh --profile kingcode` 的用户补丁层。profile 根是空列表，整棵树由
# package.json 里 bundles（@deepseek-ai/dsh-base → dsh-web-app）各自的 insert 叠出，
# 本文件最后叠上（再往上只有 --patch 覆盖层）。语义（dsh-app-boot README）：
# id 定向的补丁**整段替换**目标行的 config（不深合并，保留的字段要重述）；insert 追加行；
# 对不存在的 id 只在 stderr 警一句、不报错——改完务必
# `dsh --profile kingcode --dump-config`，目标行上方应标
# "patched by .../profiles/kingcode/cordis.patch.yml"。
#
# 相对路径的 name 解析到 $DSH_HOME/profiles/kingcode/，不是本仓库（setup.sh 把本文件
# 原样拷过去），所以这里只能写 bundle 里已有的 id，或 profile node_modules 里 link 了的包名。

# ── 身份 ───────────────────────────────────────────────────────────────────
# 与根 cordis.yml 的身份句逐字一致；工作纪律不写在 persona 里（理由见 AGENTS.md 与
# plugins/prompt-sections.js 头注释）。
#
# 它在 Web 形态下的实际作用范围要说清：上游 system-prompt 把 persona 注册为全局
# `deployment:persona` 段，而随 dsh 发行的每个 agent preset（standard/code/cordis/minimal，
# 见 <dsh 安装目录>/config/agent-presets/*/agent.cordis.yml）都挂了 dsh-persona 行，
# 在 agent 作用域**遮蔽**这条全局 persona——用户在 Web 里选任何一个内置 preset，
# 模型看到的仍是上游那句 "You are a coding agent…"。这里改的是全局默认值：没有
# dsh-persona 行的 preset 和 host 侧的冷读取才用得到。
# 让客户端真正姓 KingCode 的是 KingCode 自己的 preset：presets/kingcode/agent.cordis.yml
# （setup.sh 装到 $DSH_HOME/.agent-presets/kingcode/，Web 新会话选「KingCode」，或在
# settings.yaml 写 agent-presets.default: kingcode）。它挂 dsh-persona（同一句身份句）+
# 上游 standard 的工具面 + 本仓库 prompt-sections（Web 开关）+ env-context。
- id: system-prompt
  config:
    persona: |
      You are KingCode, an expert coding agent powered by the {{model}} model.
      Your working directory is {{cwd}}.

      Respond in the language the user uses.

# 默认模型：base 层给的是 flash，这里抬到 pro。用户在 Web 模型选择器里的选择
# （写进 $DSH_HOME/settings.yaml 的 agent-default-model: 节）仍优先于此。
- id: agent-default-model
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

# ── 默认预设 ───────────────────────────────────────────────────────────────
# 新会话默认起在 KingCode 自己的预设上（组合层默认值是上游的 `standard`）。
#
# 这一行为什么不够、还得给 KingCode 一个自己的 DSH_HOME：
# ① dsh 启动器（profile-boot）在所有补丁层之上再压一个 agent-presets 覆盖层，
#    把 `roots` 强行写成「随 dsh 发行的那一份」——在这里配 roots 会被整段丢掉，
#    能留下的只有 default 与 includeUserRoot；
# ② 用户根固定是 <dshHome>/.agent-presets，只跟着 DSH_HOME 走。共用 ~/.dsh 时，
#    同机另一个 dsh 产品的领域预设就摆在那儿，会一并出现在 KingCode 的预设选择器里；
# ③ $DSH_HOME/settings.yaml 的 agent-presets.default 属于**设置层**，优先级高于
#    本行，共用 home 时别人写的默认预设会盖掉这里。
# 所以 KingCode 走自己的 home（~/.kingcode，见 profile/setup.sh 与 mac/win 两端客户端）。
- id: agent-presets
  config:
    default: kingcode

# ── 品牌层 ─────────────────────────────────────────────────────────────────
# 节点半侧改 <title>/favicon/manifest，浏览器半侧叠配色（client-modules 扫到本包的
# dsh.client 声明后自动 serve /plugins/<id>/client.js）。包名能解析，是因为 setup.sh 用
# `dsh plugin --profile kingcode add -w $REPO/web-brand` 把它 link 进了 profile。
- insert:
    - id: kingcode-brand
      name: 'kingcode-web-brand'

# ── 工作纪律段（plugins/prompt-sections.js）—— 不在这层挂，挂在 preset 里 ──────
# 纪律段与身份一样属于 agent 作用域的事：挂在这层会落到每个 preset 与每个子代理上，
# 且此处到不了仓库路径（相对 name 解析到 profile 目录）。它现在随 KingCode preset 一起挂
# （presets/kingcode/agent.cordis.yml，用 setup.sh link 进来的包名 kingcode/plugins/…
# 引用），并按段开关关掉了一次性 CLI 的两段（session-contract / tool-routing）、
# 打开了面向交互式 Web 的 web-routing。
