# 凭证桥 —— **只给跨机形态用**的 opt-in 覆盖层。
#
# 解决的问题：上游把 credentials.* 钉死在 loopback，而鸿蒙形态天然跨机（引擎在虚拟机、
# 客户端在宿主），于是「填 API key」在鸿蒙上无路可走。真机实测（172.16.105.2:3081）：
# credentials.describe / credentials.set 均 forbidden，同机换 127.0.0.1 就正常。
#
# 为什么是单独一个文件、而不是写进 profile/cordis.patch.yml：
# 它是个**写凭证的入口**。虽然开得很窄（只写不读、只认白名单里的 DEEPSEEK_API_KEY、
# 用的是与其余 API 同一份 trustedHosts），但默认值该是「没有这个入口」——
# 本机 localhost 用 dsh 自带的凭证页就够了，根本不需要它。
#
# 用法（与 bind-all 叠加）：
#   DSH_HOME=$HOME/.kingcode dsh --profile kingcode \
#     --patch <绝对路径>/bind-all.patch.yml \
#     --patch <绝对路径>/credential-bridge.patch.yml \
#     --port 3081
# kingcode-web.sh 在 KINGCODE_CREDENTIAL_BRIDGE=1 时会自动带上这一条。
#
# 挂上之后自查（在虚拟机里，跨机地址）：
#   curl -s -X POST -H 'content-type: application/json' -H 'Host: <虚拟机IP>:3081' \
#     -d '{"type":"client-request","rpcId":"p","method":"get","payload":{}}' \
#     http://<虚拟机IP>:3081/kingcode-credentials/get
# 应当回 {"ok":true,"value":{"refs":{"DEEPSEEK_API_KEY":{"configured":…}}}}；
# 403 说明 Host 不在信任名单里（IP 漂了就 restart）。
#
# 包名 `kingcode` 由 setup.sh 的 `dsh plugin add -w $REPO` link 进 profile。
- insert:
    - id: kingcode-credential-bridge
      name: 'kingcode/plugins/credential-bridge.js'
