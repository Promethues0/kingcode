# KingCode 组合树 —— 基于 DeepSeek Harness 的一次性编程智能体。
# 底本：deepseek-harness examples/headless-agent/cordis.yml + headless bundle 的
# runner 接线。每行 {id, name, config}，行序即挂载声明序（实际按 inject 依赖并发）。

# 用户设置（$DSH_HOME/settings.yaml，热加载）：llm-deepseek: 节可免重启覆盖适配器配置
- id: settings
  name: '@deepseek-ai/dsh-settings-file'

# 凭证库：进程环境变量 > $DSH_HOME/.credentials.yaml（0600，热加载）。
# 适配器每次请求经它解析 DEEPSEEK_API_KEY，密钥永不写进本文件。
- id: credentials
  name: '@deepseek-ai/dsh-credentials-local'

# models 不写：回落适配器默认目录（V4 Pro/Flash 各 1,000,000 token 窗口）。
# 若需成本护栏，在 $DSH_HOME/settings.yaml 的 llm-deepseek: 节覆盖，别改这里。
# retryPolicy 用调宽退避的 normal 模式（always 会对认证/配额类永久错误无限重试）。
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    thinking: enabled
    reasoningEffort: high
    # 适配器默认输出上限是 256k，而 contextWindow 是「请求+响应」合计 1M：
    # 不压到一个合理值，压缩阈值 × 窗口 + 输出预算就会越过窗口本身。
    maxTokens: 32000
    retryPolicy:
      mode: normal
      backoff:
        initialDelayMs: 1000
        maxDelayMs: 30000
        jitterRatio: 0.2

# 多厂商适配器（Anthropic / OpenAI / OpenAI 兼容网关）。
# **必须挂**：agent-default-model 的选择来自用户级 settings.yaml，而它由
# Web UI 的模型选择器写入——只挂 deepseek 适配器的话，用户在 Web 里选了
# Claude，CLI 就会报 NO_ADAPTER。路由与模型目录由 settings.yaml 的
# `llm-pi-ai:` 节提供，这里不写死。
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'

# runner 经 agentDefaultModel.currentSelection() 取默认模型；
# 该值会被用户级 settings.yaml 覆盖（设置层优先于组合层）
- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

# 模型熔断与降级（第三方 dsh-model-failover）。
# 装它的理由写在本仓库 README 里：`llm/retry` 的退避是「静默十几分钟」的头号
# 成因——一个模型开始限流，上游只会一轮轮退避重试，无人值守时就这么烧下去。
# 这一行让「同一个模型连续失败 N 次」变成「跳到备用模型继续跑」。
# 备用挑 flash 而不是别家：同一把 DEEPSEEK_API_KEY、同一条路由，降级不引入新依赖。
- id: model-failover
  name: 'dsh-model-failover'
  config:
    enabled: true
    fallbacks:
      - provider: deepseek-official
        model: deepseek-v4-flash
    tripCodes:
      - RATE_LIMIT
      - SERVER
      - TIMEOUT

# bash 执行器的托管子进程组
- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

# 120000 即 dsh-bash-local 的包默认；更长命令由模型按调用传 timeoutMs（persona 已教）
- id: bash
  name: '@deepseek-ai/dsh-bash-local'
  config:
    timeoutMs: 120000
    maxTimeoutMs: 600000

# ── agent 骨架（原 @deepseek-ai/dsh-agent-spine-demo 的逐行展开）──────────────
# 上游在 0.1.2-alpha.3 里删掉了 agent-spine-demo（`refactor(bundle): remove the
# agent spine demo`，2026-08-26）。它本来就在 examples/ 下、README 明说非产品
# API，所以这不是回归——是路线图里「展开为自组正式 bundle」那条被按了快进键。
#
# 下面这一组 = 该包 apply() 在 KingCode 这份 config 下**实际会 ctx.plugin 的全部
# 条目**，逐条对应（源：0.1.0-rc.6 的 lib/index.js，最后一个还带它的版本）。
# 两处按 config 分支跳过的没有展开：
#   · goals —— 根树没配 goals，spine 就不挂 goal / goal-round-driver / tool-goal；
#   · toolJobs: false —— 不挂 tool-jobs。但 jobs-local **注册表本身仍要挂**：
#     tool-bash 用 ctx.get 解析它，缺席时 run_in_background 会答「后台作业不可用」。
# skills 保持开（spine 默认 enabled: true），所以 skill / skill-filesystem /
# tool-skill 三行都在。
#
# dshHome 三处都不写：spine 原本 resolveDshHome(config.dshHome) 算一次再传给
# skill-filesystem 与 shell-env；两者省略时各自回落到 $DSH_HOME，而
# bin/kingcode.js 在 boot() 之前就把它钉成了 ~/.kingcode——同一个值，少一处能漂的副本。
#
# 展开的代价是这一组行的顺序与配置从此归本仓库维护；收益是 tools.mode（PTC）、
# system-prompt 的 toolOrder、session-title 的三个上限这些原先被 spine 的
# Config 交集挡住的旋钮，现在都能直接写在对应行上。

- id: timer
  name: '@deepseek-ai/cordis-plugin-timer'

- id: llm
  name: '@deepseek-ai/dsh-llm'

- id: session
  name: '@deepseek-ai/dsh-session'

# 三个上限照抄 spine 的 EXAMPLE_SESSION_TITLE_CONFIG（它的默认值就是这三个数）。
# 只挂 session-title 不挂 session-title-first-prompt-llm：一次性 CLI 不需要为
# 起标题再花一次模型调用，回落标题（取首条提示的前几个词）足够。
- id: session-title
  name: '@deepseek-ai/dsh-session-title'
  config:
    fallbackMaxWords: 5
    fallbackMaxBytes: 40
    maxTitleBytes: 80

# 身份句留在这里（`deployment:persona` 这个 section 名被本行的 config 占死）；
# 工作纪律在 plugins/prompt-sections.js，避免三份 persona 副本各自漂移。
# 两个 include* 是 spine 原本传的默认值 true，展开后写明。
- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
  config:
    includeHarnessIdentity: true
    includeRuntimeContext: true
    persona: |
      You are KingCode, an expert coding agent powered by the {{model}} model.
      Your working directory is {{cwd}}.

      Respond in the language the user uses.

# 工具注册表。mode 留默认 native——PTC（上游 0.1.2-alpha.2 把 Code Mode 连同
# `mode: 'code'` 一起改名成 `ptc`）要另挂 dsh-code-runtime-worker-thread 才有意义，
# 本树没挂，写了也只会让工具改走 run_code 而没有运行时。
- id: tools
  name: '@deepseek-ai/dsh-tools'

- id: skill
  name: '@deepseek-ai/dsh-skill'

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: agent
  name: '@deepseek-ai/dsh-agent'

# `llm/retry` 的退避策略执行者。它在场是 model-failover 那行有意义的前提：
# 熔断跳模型，是跳在这一层的重试之上。
- id: llm-retry
  name: '@deepseek-ai/dsh-llm-retry'

# 后台作业注册表。工具面（tool-jobs）不挂，见本节开头。
- id: jobs
  name: '@deepseek-ai/dsh-jobs-local'

# 不变量注册表 + 四个订阅者。spine 无条件挂这五行，展开照搬：它们是
# fail-loud 的一部分，缺了就是「状态坏了但没人喊」。
- id: invariants
  name: '@deepseek-ai/dsh-invariants'

- id: invariant-session
  name: '@deepseek-ai/dsh-session/invariant'

- id: invariant-agent
  name: '@deepseek-ai/dsh-agent/invariant'

- id: invariant-scope
  name: '@deepseek-ai/dsh-scope/invariant'

- id: invariant-agent-loop
  name: '@deepseek-ai/dsh-agent-loop/invariant'

# bash 工具的环境（把 DSH_HOME 等变量送进模型的 shell）
- id: shell-env
  name: '@deepseek-ai/dsh-shell-env'

# 后台执行面在工具层整体关闭：一次性 CLI 退出时会 dispose 整棵树，树外
# 存活的工作必然被带走。与其让 persona 去劝模型别用，不如让参数与工具
# 根本不出现在 schema 里——这个状态就在结构上无法产生。详见 AGENTS.md。
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  config:
    enableRunInBackground: false

# AGENTS.md / CLAUDE.md 装载
- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# 具体的 agent 循环。agents 留空——headless runner 自建 agent。
- id: agent-loop
  name: '@deepseek-ai/dsh-agent-loop'
  config:
    agents: []

# root 必须随 compression 一起切：同一 root 下明文与 zstd 会话不能混放，混了
# 后端 fail-loud 拒启（错误信息也不指向解法）。只要跑过一次 DSH_SNAPSHOT=1，
# 之后的普通调用就永久坏掉——所以快照模式用自己的 root。
- id: persistence
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js "process.env.DSH_SNAPSHOT === undefined ? './.kingcode/sessions' : './.kingcode/sessions-plain'"
    compression: !!js "process.env.DSH_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: checkpoint-policy
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

# 历史逼近上下文窗口时压缩旧段
- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

# 压缩前先修剪历史里的大段工具输出（head/tail 保留），别让它们整段吃掉摘要预算
- id: tool-result-pruner
  name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
  config:
    thresholdChars: 8192
    headChars: 4096
    tailChars: 1024

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    # 0.8 是上游默认。降到 0.5 是为了让上面那个 pruner 真的有机会跑：引擎是
    # 「超阈值 → 修剪 → 重新计量 → 仍超才摘要」，修剪是零模型调用的，早一点
    # 介入几乎无成本；而摘要是有损的，所以也不宜再低（0.5 + 输出预算远未超窗）。
    thresholdRatio: 0.5
    retainRatio: 0.16
    # 摘要预算：8192 在 reasoningEffort high 下可能被推理 token 吃掉大半，
    # 而截半的检查点就是之后整段会话的唯一记忆。
    maxTokens: 32000
    compactionRetries: 1

# 子代理身份投影；subagent 目录读取缺此能力会 fail loud
- id: session-projection
  name: '@deepseek-ai/dsh-session-projection'

# 子代理：spawn（全新子会话）与 fork（复用已完成前缀）双后端
- id: subagent
  name: '@deepseek-ai/dsh-subagent'

- id: subagent-spawn-in-process
  name: '@deepseek-ai/dsh-subagent-spawn-in-process'
  config:
    providerName: spawn

- id: subagent-fork-in-process
  name: '@deepseek-ai/dsh-subagent-fork-in-process'
  config:
    providerName: fork

# 一次性会话里子代理必须是前台的：continuable 下模型不传 run_in_background 就
# 默认走后台（上游还自带一段「默认用后台」的系统提示），而 runner 第一次静默就
# 退出——子代理连同结果一起被 dispose 带走。改 one-shot 后默认前台返回最终文本。
# 同理不挂 tool-subagent-control / tool-subagent-report：没有 continuable 子代理
# 时它们注册的 send_message / interrupt_agent / report 是永远等不到第二轮的死工具。
- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: one-shot
    enableRunInBackground: false
    maxDepth: 1

# fork 保持 one-shot：continuable 子代理的 report 工具与提示段先于 fork
# 复用的继承历史（上游架构笔记 2026-08-10）
- id: tool-subagent-fork
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: fork
    toolName: subagent_fork
    backgroundMode: one-shot
    enableRunInBackground: false
    maxDepth: 1

# 只读探索子代理：与 subagent 同一个 spawn provider、同款 one-shot 前台，区别只在
# 两项按实例固定的子策略：toolFilter.allow 只留 read/glob/grep/lsp（**不放 bash**——
# 过滤的是子代理能看见的工具，是可见性不是权限边界，留着 bash 就等于留着
# `bash -c 'sed -i …'`）；persona 在子作用域遮蔽根 persona，同样经 {{model}}/{{cwd}}
# 插值。子代理仍会看到 write/edit 等工具的指导文本（上游不按工具过滤指导段），
# 但调用会得到 UNKNOWN_TOOL——persona 里那句「你没有改文件的工具」就是压这层噪音。
- id: tool-subagent-explore
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: explore
    backgroundMode: one-shot
    enableRunInBackground: false
    maxDepth: 1
    # 只读探索者钉在 flash：它干的是 read/glob/grep/lsp 加一段复述，不需要 pro 的
    # 推理预算，而它恰恰是最容易被叫很多次的那个工具。省的是钱与首字延迟，不是
    # 判断力——探索结果以文本回给父代理，结论仍由 pro 做。
    # 与 model-failover 那行同款理由：同一把 DEEPSEEK_API_KEY、同一条路由，
    # 降档不引入新依赖。
    #
    # agentOptions 是**按实例固定的部署侧默认值**，与「模型自选路由」是两回事：
    # 后者（上游 list_subagent_models + provider/model/reasoning_effort 参数）要
    # Host 侧的 subagent-model-selection 设置开关，headless 这棵树上根本没有那层。
    # 这里写死，模型看不见也改不了。
    agentOptions:
      provider: deepseek-official
      model: deepseek-v4-flash
    toolFilter:
      # 必须跟着 LSP 三行的开关走：tools.restrict() 对未知工具名是硬失败
      # （dsh-tools「names unknown global tool」），KINGCODE_LSP=0 时若还列着
      # lsp，explore 子代理每次启动都炸——只读探索者这个能力整体消失，而退出码
      # 还是 0（模型会自己退回 subagent，白费两轮）。
      allow: !!js "process.env.KINGCODE_LSP === '0' ? ['read', 'glob', 'grep'] : ['read', 'glob', 'grep', 'lsp']"
    persona: |
      You are KingCode's read-only explorer, a delegated subagent powered by the {{model}} model.
      Your working directory is {{cwd}}.

      Investigate using only the read-only tools you can see (file reading, glob, grep, and — when present — lsp for semantic navigation: definitions, references, implementations, hover). You have no tool that modifies files, runs commands, or reaches the network, and you must not try to work around that. Report what you found as text: cite file paths and line numbers, quote only what matters, and end with a concise summary for the delegating agent. Never end your turn with a question.

      Respond in the language the task uses.

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# 文件系统：observation-policy 必须先于 tool-fs（写/改要求先读过）
- id: fs-local
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.cwd()

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

# 溢写后端：grep 超过 250 条匹配的部分要落盘，否则静默丢弃（tool-fs-search 是
# 执行期 ctx.get('spillStore')，缺后端只 warn 一句）。落仓库内便于模型 read 回来。
- id: spill
  name: '@deepseek-ai/dsh-spill-local'
  config:
    root: './.kingcode/spill'
    # 上游 0.1.2-alpha.2 给这个后端加了「激活后跑一趟清扫」（`feat(spill-local):
    # one-shot startup cleanup for local spill files`）：没有定时器、没有守护进程，
    # 就是启动时扫一遍 root，删 mtime 早于 now − cleanupPeriodDays 的普通文件，
    # 再把空的 session 目录收掉。一次性 CLI 正是它设计时想的那个形态。
    # 默认就是 30，写出来是因为**它改变了既有行为**：在此之前 ./.kingcode/spill
    # 是只涨不跌的。0 = 关掉。
    cleanupPeriodDays: 30

# 工具调用超时的执行者：glob/grep/web 等在 ToolDefinition 上声明的 timeoutMs
# 全靠它兑现——没有它整棵树没有任何 tools/execute 包装器，声明形同虚设。
- id: timeout-policy
  name: '@deepseek-ai/dsh-tool-call-timeout-policy'

# 死循环刹车：无人值守时模型卡在同一个失败调用上会一路烧到压缩。纯提醒，不否决。
- id: repeat-tool-reminder
  name: '@deepseek-ai/dsh-repeat-tool-reminder'
  config:
    thresholds: [3, 5, 8]
    exclude: [todo_write]

# 破坏性命令闸门（自己写的，见 plugins/command-guard.js 文件头）。
# 这棵树到目前为止对 bash 只有一条约束：60s 超时。`rm -rf` / `git reset --hard` /
# `push --force` 一旦被模型选中就没有回头路，而 KingCode 的常态是**无人值守**跑
# 任务与 eval——出事时没有人在旁边按 Ctrl-C。
# 命中即拒绝：让这次工具调用失败并把原因交回给模型（它会换个做法），
# 而不是挂起等人确认——headless 下等确认等于挂死。
#
# 生态里三个现成插件（dsh-barricade / worktree-mgr / dsh-permission-rules）都试过，
# 在这棵 headless 树上都跑不起来（读未声明的 ctx.approval、工具 schema 是 type:null
# 污染整个目录、依赖 headless 没有的 commands 服务），所以这一层自己写。
- id: kingcode-command-guard
  name: './plugins/command-guard.js'

# 工具输出漏斗（第三方 dsh-funnel）。
# 与上面的 tool-result-pruner 不重复：那个是**压缩时**按字符数截历史里的旧输出，
# 这个是**输出刚产生时**按内容裁——保留 error/warning 行与头尾，全文落盘留指针。
# 两者叠加的效果是：一次失败的构建日志进上下文时就只剩关键行，而不是等它先把
# 窗口吃掉一大块、再被拦腰截断（截断点常常正好切掉报错那几行）。
- id: dsh-funnel
  name: 'dsh-funnel'

# ── 语义导航（seam → stdio provider → 工具）─────────────────────────────────
# 三行是一组，靠 KINGCODE_LSP=0 整体关掉（loader 支持条目级 disabled，`!!js`
# 表达式在同一个 with(ctx) 作用域里求值）。关掉后 lsp 工具连同它的提示词段
# 一起消失，其余能力不受影响。
#
# **前提是仓库根的 jsconfig.json**：没有它，TypeScript 把每个「打开即查」的
# 文件当独立推断项目，findReferences 只报本文件内的引用（实测 summarize：
# 2 处 vs 真实 6 处）。查引用不全比没有这个工具更危险，所以那个文件不是可选项。
- id: lsp
  name: '@deepseek-ai/dsh-lsp'
  disabled: !!js "process.env.KINGCODE_LSP === '0'"

# server 用 typescript@7（devDependency）自带的**原生二进制**，不走
# node_modules/.bin/tsc：后者是个 node 脚本，再 execve 到同一个二进制，白搭一次
# Node 启动（本机实测 initialize 57-314ms vs 直连 9-16ms，各 5 次）。B9 调研报的那次
# 90ms→90s 卡顿只在走 .bin 时出现过，本次两种走法各 5 次都没复现——选原生二进制
# 的决定性理由是那笔可测的启动成本，不是那次未复现的卡顿。
# command 必须是绝对路径或裸 PATH 名（含 / 的相对路径被 subprocess-local 拒绝），
# 所以从 baseUrl（本文件所在目录的 file URL）拼；平台后缀照 typescript 自己的
# getExePath 规则算。二进制不存在 = boot 期 fail-loud（apply 里 resolveExecutable
# 先解析完所有 server 才注册任何 provider），这是有意的：静默降级会让模型
# 以为「没有引用」。进程本身惰性，首次匹配的查询才 spawn。
- id: lsp-stdio
  name: '@deepseek-ai/dsh-lsp-stdio'
  disabled: !!js "process.env.KINGCODE_LSP === '0'"
  config:
    servers:
      typescript:
        command: !!js "(p => process.platform === 'win32' ? p.slice(1) : p)(decodeURIComponent(new URL('node_modules/@typescript/typescript-' + process.platform + '-' + process.arch + '/lib/tsc' + (process.platform === 'win32' ? '.exe' : ''), baseUrl).pathname))"
        args: ['--lsp', '-stdio']
        # 路由只按小写扩展名，且一个扩展名只能有一个 provider（撞了 LSP_CONFLICT）。
        # 没人认领的扩展名查询抛 LSP_UNAVAILABLE——加别的语言就在 servers 下再开
        # 一个条目，认领它自己那组扩展名。
        extensionToLanguage:
          '.ts': typescript
          '.tsx': typescriptreact
          '.mts': typescript
          '.cts': typescript
          '.js': javascript
          '.jsx': javascriptreact
          '.mjs': javascript
          '.cjs': javascript

# 模型侧只读工具 `lsp`：operation ∈ {goToDefinition, findReferences,
# goToImplementation, hover}，坐标是 1-based UTF-16。声明的 60s 超时同样靠上面
# 的 timeout-policy 兑现。
- id: tool-lsp
  name: '@deepseek-ai/dsh-tool-lsp'
  disabled: !!js "process.env.KINGCODE_LSP === '0'"

# 结构化代码搜索（glob/grep，包内自带 ripgrep）——不用再在 bash 里手写 grep
- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── 测试稳定性（第三方，零 @deepseek-ai 依赖）──────────────────────────────
# flakefinder：把测试重复跑 N 遍，把偶发失败与真回归分开，并维护隔离清单。
# 直接接 eval/baseline.json 的门禁——现在一条 WARN 到底是回归还是抖动，
# 只能靠人再跑几遍去猜，而这正是「基线门禁」最容易失去信任的地方。
- id: flakefinder
  name: 'dsh-flakefinder'

# ── web 能力（seam → 两个 provider → 工具）────────────────────────────────
# 网络出口：web_fetch 只收 http/https、拒 URL 内嵌凭证、只跟同源重定向、字节/
# 字符/跳数有上限；web_search 走 DeepSeek 的 Anthropic 兼容 Messages API，
# 复用 DEEPSEEK_API_KEY（不引入新密钥；端点是 anthropic/v1，与聊天端点无关）。
# 两工具声明的 30s 超时由上面的 timeout-policy 兑现。
- id: web
  name: '@deepseek-ai/dsh-web'

- id: web-fetch
  name: '@deepseek-ai/dsh-web-fetch-http'

- id: web-search
  name: '@deepseek-ai/dsh-web-search-deepseek'

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'

# KingCode 自定义工具（本仓库 plugins/ 下，相对本文件解析）——
# 批量原子编辑：一次调用多处替换、可跨文件、按文件原子（上游没有同类工具）
- id: kingcode-multi-edit
  name: './plugins/multi-edit.js'

# 工作纪律与工具取舍的系统提示词段（persona 只留身份句，理由见插件头注释）
- id: kingcode-prompt-sections
  name: './plugins/prompt-sections.js'
  config:
    # 与下方 LSP 三行同一个开关：关掉 LSP 后这段就不该再推销 lsp 工具，
    # 否则模型会去调一个不存在的工具（响亮的 UNKNOWN_TOOL，白费一轮）
    lsp: !!js "process.env.KINGCODE_LSP !== '0'"

# 运行时上下文：日期 / 平台 / git 分支与工作树脏净（context 而非 section：只在文本
# 变化时重新注入，稳定快照全程只占一次；git 只在 apply 时拍一次快照，不在每步 spawn）
- id: kingcode-env-context
  name: './plugins/env-context.js'

# 一次性任务驱动：startup 解析任务位置参数（需 bin 先 provideCmdline），
# runner 建 agent → followup → 等静默 → 打印最终回答 → 按结果退出
- id: kingcode-startup
  name: './plugins/startup.js'

- id: kingcode-runner
  name: './plugins/runner.js'
  inject: [headlessStartup]
  config:
    task: !!js ctx.headlessStartup.task
